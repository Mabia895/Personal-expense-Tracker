<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .form-control, .form-select {
      margin-bottom: 10px;
    }
    .table th, .table td {
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">💰 Personal Expense Tracker</h2>

    <!-- Expense Form -->
    <form id="expense-form" class="row g-3">
      <div class="col-12 col-md-3">
        <input type="text" id="expense-name" class="form-control" placeholder="Expense Name" required>
      </div>
      <div class="col-12 col-md-2">
        <input type="number" id="expense-amount" class="form-control" placeholder="Amount" required>
      </div>
      <div class="col-12 col-md-2">
        <input type="date" id="expense-date" class="form-control" required>
      </div>
      <div class="col-12 col-md-3">
        <select id="expense-category" class="form-select">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Utilities">Utilities</option>
        </select>
      </div>
      <div class="col-12 col-md-2 d-grid">
        <button type="submit" class="btn btn-primary">Add Expense</button>
      </div>
    </form>

    <!-- Filter Dropdown -->
    <div class="row mt-4">
      <div class="col-md-4">
        <label for="filter-category" class="form-label">🔍 Filter by Category:</label>
        <select id="filter-category" class="form-select">
          <option value="All">All</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Utilities">Utilities</option>
        </select>
      </div>
    </div>

    <!-- Expense Table -->
    <div class="table-responsive mt-4">
      <table id="expense-table" class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Amount (₹)</th>
            <th>Date</th>
            <th>Category</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    const form = document.getElementById('expense-form');
    const tableBody = document.querySelector('#expense-table tbody');
    const filterCategory = document.getElementById('filter-category');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('expense-name').value;
      const amount = parseFloat(document.getElementById('expense-amount').value);
      const date = document.getElementById('expense-date').value;
      const category = document.getElementById('expense-category').value;

      const expense = { name, amount, date, category };
      const expenses = JSON.parse(localStorage.getItem('expenses')) || [];
      expenses.push(expense);
      localStorage.setItem('expenses', JSON.stringify(expenses));
      form.reset();
      displayExpenses();
    });

    filterCategory.addEventListener('change', displayExpenses);

    function displayExpenses() {
      const expenses = JSON.parse(localStorage.getItem('expenses')) || [];
      const selectedCategory = filterCategory.value;
      tableBody.innerHTML = '';

      expenses.forEach((exp, index) => {
        if (selectedCategory === 'All' || exp.category === selectedCategory) {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${exp.name}</td>
            <td>${exp.amount}</td>
            <td>${exp.date}</td>
            <td>${exp.category}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteExpense(${index})">Delete</button></td>
          `;
          tableBody.appendChild(row);
        }
      });
    }

    function deleteExpense(index) {
      const expenses = JSON.parse(localStorage.getItem('expenses')) || [];
      expenses.splice(index, 1);
      localStorage.setItem('expenses', JSON.stringify(expenses));
      displayExpenses();
    }

    window.onload = displayExpenses;
  </script>
</body>
</html>
